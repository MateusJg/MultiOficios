services:
  # ============================================================================
  # 1. Microservicio Frontend (React 19 + Tailwind CSS + Vite / Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multioficios_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - multioficios_network

  # ============================================================================
  # 2. Microservicio Backend (Node.js + Express + TypeScript)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: multioficios_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    volumes:
      - datos_volume:/app/datos
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ADMIN_MASTER_PASSWORD=${ADMIN_MASTER_PASSWORD:-AdminMultiOficio$$2026}
      - ESCROW_SIGNING_SECRET=${ESCROW_SIGNING_SECRET:-multioficios-fiduciary-escrow-signing-key-2026}
      - CORS_ORIGINS=*
    networks:
      - multioficios_network

networks:
  multioficios_network:
    driver: bridge

volumes:
  datos_volume:
    driver: local
